<!DOCTYPE html>
<html>

<head>
    <script>
        window.onload = function () {
            const targetUrl = "https://eternal-poodle-exactly.ngrok-free.app/";
            const fallbackUrl = "./server_down.html"; // 请替换为实际的备用网址
            const xhr = new XMLHttpRequest();
            xhr.open('GET', targetUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        window.location.href = targetUrl;
                    } else {
                        window.location.href = fallbackUrl;
                    }
                }
            };
            xhr.send();
        };
    </script>
</head>

<body>
    <p>若无法跳转，请点击 <a href="https://eternal-poodle-exactly.ngrok-free.app/">here</a></p>
</body>

</html>
